<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>藥物計數器 V3.1 (拍照存檔版)</title>
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        video { display: none; }
        /* 畫布容器 */
        .canvas-wrapper { position: relative; width: 100%; max-width: 640px; }
        canvas { width: 100%; height: auto; border: 1px solid #333; display: block; }
        
        /* 閃光燈特效層 */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10;
        }

        /* UI 容器 */
        .ui-container { 
            position: fixed; bottom: 0; width: 100%; 
            background: rgba(20,20,20,0.95); 
            padding: 10px 0 20px 0; 
            border-radius: 20px 20px 0 0; 
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 數量顯示 */
        .count-box { font-size: 36px; font-weight: bold; color: #0f0; margin: 5px 0; text-shadow: 0 0 10px rgba(0,255,0,0.5); }

        /* 拍照按鈕 */
        .snap-btn {
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            color: #333; border: none;
            padding: 10px 40px; border-radius: 50px;
            font-size: 18px; font-weight: bold;
            margin-bottom: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 8px;
        }
        .snap-btn:active { transform: scale(0.95); background: #ccc; }

        /* 控制項排版 */
        .control-group { display: flex; flex-wrap: wrap; justify-content: space-around; width: 100%; font-size: 11px; padding: 0 10px; box-sizing: border-box; }
        .control-item { width: 45%; margin-bottom: 8px; display: flex; flex-direction: column; align-items: center; }
        input[type="range"] { width: 100%; accent-color: #0f0; }
        
        #status { position: absolute; top: 40%; width: 100%; text-align: center; color: #aaa; z-index: 5; }
    </style>
</head>
<body>

    <div id="status">系統載入中...</div>

    <div class="canvas-wrapper">
        <div id="flash-overlay"></div>
        <video id="videoInput" playsinline webkit-playsinline></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="ui-container">
        <div class="count-box"><span id="countDisplay">0</span> 顆</div>
        
        <button id="snapBtn" class="snap-btn">
            <span>📸</span> 拍照存檔
        </button>
        
        <div class="control-group">
            <div class="control-item">
                <label>光照適應 (Block): <span id="blockVal">31</span></label>
                <input type="range" id="blockSizeRange" min="3" max="99" step="2" value="31">
            </div>
            <div class="control-item">
                <label>背景剔除 (C): <span id="cVal">2</span></label>
                <input type="range" id="cRange" min="0" max="20" value="2">
            </div>
            <div class="control-item">
                <label>分離黏著 (Erode): <span id="erodeVal">4</span></label>
                <input type="range" id="erodeRange" min="0" max="10" value="4">
            </div>
            <div class="control-item">
                <label>圓度要求 (Circ): <span id="circVal">0.5</span></label>
                <input type="range" id="circRange" min="0.1" max="0.9" step="0.1" value="0.5">
            </div>
        </div>
    </div>

    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>

    <script type="text/javascript">
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let countDisplay = document.getElementById('countDisplay');
        let statusText = document.getElementById('status');
        let snapBtn = document.getElementById('snapBtn');
        let flashOverlay = document.getElementById('flash-overlay');

        // 全域變數紀錄當前數量，供拍照使用
        let currentPillCount = 0;

        let config = {
            blockSize: 31, 
            cValue: 2,     
            erodeSize: 4,
            minCircularity: 0.5,
            minArea: 150
        };

        // UI 事件綁定
        document.getElementById('blockSizeRange').oninput = (e) => { 
            let val = parseInt(e.target.value); if(val%2===0) val++; 
            config.blockSize = val; document.getElementById('blockVal').innerText = val; 
        };
        document.getElementById('cRange').oninput = (e) => { config.cValue = parseInt(e.target.value); document.getElementById('cVal').innerText = config.cValue; };
        document.getElementById('erodeRange').oninput = (e) => { config.erodeSize = parseInt(e.target.value); document.getElementById('erodeVal').innerText = config.erodeSize; };
        document.getElementById('circRange').oninput = (e) => { config.minCircularity = parseFloat(e.target.value); document.getElementById('circVal').innerText = config.minCircularity; };

        // 拍照功能實作
        snapBtn.onclick = () => {
            // 1. 閃光燈特效
            flashOverlay.style.opacity = 0.8;
            setTimeout(() => { flashOverlay.style.opacity = 0; }, 100);

            // 2. 產生檔名 (時間 + 數量)
            let now = new Date();
            let timeStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
            let filename = `藥物計數_${timeStr}_數量${currentPillCount}.png`;

            // 3. 下載圖片
            // 因為我們已經在 canvas 上繪製了文字，直接下載 canvas 內容即可
            let link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL("image/png");
            link.click();
        };

        function onOpenCvReady() { statusText.innerText = '啟動相機...'; startCamera(); }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
                });
                video.srcObject = stream;
                video.play();
                video.onloadedmetadata = () => {
                    statusText.style.display = 'none';
                    video.width = video.videoWidth; video.height = video.videoHeight;
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    processVideo();
                };
            } catch (err) { statusText.innerText = '錯誤: ' + err; }
        }

        function processVideo() {
            let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
            let gray = new cv.Mat();
            let binary = new cv.Mat();
            let cap = new cv.VideoCapture(video);
            let anchor = new cv.Point(-1, -1);

            const FPS = 30;

            function loop() {
                try {
                    let start = Date.now();
                    cap.read(src);
                    
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                    cv.GaussianBlur(gray, gray, new cv.Size(7, 7), 0);
                    cv.adaptiveThreshold(gray, binary, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, config.blockSize, config.cValue);

                    if(config.erodeSize > 0) {
                        let kernel = cv.Mat.ones(config.erodeSize, config.erodeSize, cv.CV_8U);
                        cv.erode(binary, binary, kernel, anchor, 1);
                        kernel.delete();
                    }

                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(binary, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                    let count = 0;
                    let displayMat = src.clone();

                    for (let i = 0; i < contours.size(); ++i) {
                        let cnt = contours.get(i);
                        let area = cv.contourArea(cnt);
                        
                        if (area > config.minArea) {
                            let perimeter = cv.arcLength(cnt, true);
                            let circularity = (perimeter > 0) ? (4 * Math.PI * area) / (perimeter * perimeter) : 0;

                            if (circularity > config.minCircularity) {
                                count++;
                                let circle = cv.minEnclosingCircle(cnt);
                                
                                // 畫圓圈
                                cv.circle(displayMat, circle.center, circle.radius, new cv.Scalar(0, 255, 0, 255), 2);
                            }
                        }
                    }

                    // 更新全域變數
                    currentPillCount = count;
                    countDisplay.innerText = count;

                    // --- 將數據燒錄到畫面左上角 ---
                    // 這樣截圖時，圖片裡面就會有文字
                    let dateText = new Date().toLocaleString();
                    let countText = `Count: ${count}`;
                    
                    // 文字背景黑框 (增加可讀性)
                    cv.rectangle(displayMat, new cv.Point(0, 0), new cv.Point(220, 70), new cv.Scalar(0, 0, 0, 255), -1);
                    
                    // 寫入日期
                    cv.putText(displayMat, dateText, new cv.Point(10, 25), cv.FONT_HERSHEY_SIMPLEX, 0.5, new cv.Scalar(255, 255, 255, 255), 1);
                    // 寫入數量 (大字)
                    cv.putText(displayMat, countText, new cv.Point(10, 60), cv.FONT_HERSHEY_SIMPLEX, 1.0, new cv.Scalar(0, 255, 0, 255), 2);
                    // -----------------------------

                    cv.imshow('canvasOutput', displayMat);

                    displayMat.delete(); contours.delete(); hierarchy.delete();
                    setTimeout(loop, 1000/FPS - (Date.now() - start));

                } catch(e) { console.error(e); }
            }
            loop();
        }
    </script>
</body>
</html>
